<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign Up</title>
    <style>
        body{font-family: Arial, sans-serif;
            background-color: #fef5dd;
            display: grid;
            justify-content: center;
            align-content: center;
            height: 100vh;
            background-image: url(bg.jpg);
            background-repeat:no-repeat;
            background-position:center;
            background-size:cover;}

        .signup_box{background-color: white;
                    padding: 30px;
                    box-shadow: 0 4px 8px #7a7a7a;
                    width: 300px;
                    text-align: center;
                    border-radius: 10px;
                    transform: translateX(-100%);
                    opacity: 0;
                    animation: slideIn 0.6s ease-out forwards;}

        h2 {margin-bottom: 20px;
            font-size: 24px;}

        input{width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            box-sizing: border-box;
            border-radius: 10px}

        button{background-color:#5945a0 ;
            color: white;
            padding: 14px 20px;
            width: 100%;
            border-style: none;
            border-radius: 10px}

        button:hover{background-color: #874caf;}

        .thing1{margin-top: 20px;
            font-size: 14px;}

        .thing1 a{color: #001aff;}

        .thing1 a:hover{text-decoration: underline;}

        #error {margin-top: 10px;
            font-size: 14px;
            color: red;}

        @keyframes slideIn {to{transform: translateX(0);
                            opacity: 1;}}
    </style>
</head>

<body>
    <div class="signup_box">
        <h2>Sign Up</h2>
        <form id="signupForm">
            <input type="email" id="email" name="email" placeholder="Email" required>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <button type="submit">Sign Up</button>
        </form>

        <div id="error"></div>

        <div class="thing1">
            <p>Already have an account? <a href="Login.html">Login here</a></p>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {e.preventDefault();
                                                                                    const email = document.getElementById('email').value.trim();
                                                                                    const password = document.getElementById('password').value;

            if(email === "" || password === "") {document.getElementById('error').textContent = "Please fill out all fields.";
                return;}

            const user = {email,
                        password};

            localStorage.setItem('user', JSON.stringify(user));
            const msgDiv = document.getElementById('error');
            msgDiv.style.color = "green";
            msgDiv.textContent = "Sign up successful! You can now login.";
            this.reset();});
    </script>
</body>
</html>
